<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 告知前：検索エンジンにインデックスさせない -->
<meta name="robots" content="noindex, nofollow">
<title>2026年度 日本デザイン学会 秋季企画大会</title>
<style>
  :root{
    --bg:#f4f2ee; --ink:#2b2b2b; --sub:#6b6b6b; --line:#d8d4cc; --accent:#3a3a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1a1a1a; --ink:#ededed; --sub:#a0a0a0; --line:#3a3a3a; --accent:#dcdcdc; }
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:32px; line-height:1.9; text-align:center;
  }
  .card{max-width:560px;}
  .badge{
    display:inline-block; font-size:12px; letter-spacing:.2em; color:var(--sub);
    border:1px solid var(--line); border-radius:999px; padding:6px 16px; margin-bottom:28px;
  }
  h1{font-size:clamp(20px,5vw,28px); letter-spacing:.04em; line-height:1.6; margin-bottom:24px;}
  .rule{width:40px; height:2px; background:var(--accent); margin:24px auto;}
  .meta{font-size:15px; color:var(--sub);}
  .meta strong{color:var(--ink); font-weight:600;}
  .note{margin-top:32px; font-size:13px; color:var(--sub);}
  .contact{margin-top:20px; font-size:13px; color:var(--sub);}
  .contact a{color:var(--ink);}
</style>
</head>
<body>
  <main class="card">
    <span class="badge">準備中 ─ COMING SOON</span>
    <h1>2026年度<br>日本デザイン学会 秋季企画大会</h1>
    <div class="rule"></div>
    <p class="meta">
      <strong>2026年11月15日（日）</strong><br>
      立命館大学 衣笠キャンパス
    </p>
    <p class="note">大会の詳細は、追ってこのページで公開いたします。</p>
    <p class="contact">お問合せ：<a href="mailto:jssd2026fall@gmail.com">jssd2026fall@gmail.com</a></p>
  </main>
</body>
</html>
