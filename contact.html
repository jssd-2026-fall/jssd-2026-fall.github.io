<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>お問合せ｜2026年度 日本デザイン学会 秋季企画大会</title>
<meta name="description" content="大会に関するお問い合わせ先のご案内。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho+B1:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110d;            
    --ink:#f2efe9;           
    --hai:#8a847a;           
    --sub:var(--hai);
    --panel:#1b1813; --panel-2:#201c16; --line:#332e25;
    --sans:"Noto Sans JP","游ゴシック",YuGothic,"Hiragino Sans",sans-serif;
    --mincho:"Shippori Mincho B1","Hiragino Mincho ProN",serif;   
    --mono:"IBM Plex Mono",monospace;                              
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.85;font-weight:300;
    -webkit-font-smoothing:antialiased;}
  a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hai);text-underline-offset:3px;}
  a:hover{text-decoration-color:var(--ink);}
  b,strong{font-weight:500;}
  img{max-width:100%;}
  .nw{white-space:nowrap;}
  .soon{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;color:var(--hai);
    border:1px dashed #4a4438;padding:13px 28px;}
  header{position:sticky;top:0;z-index:20;background:rgba(20,17,13,.88);backdrop-filter:saturate(160%) blur(10px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 32px;}
  .brand{display:flex;align-items:center;font-weight:500;font-size:14.5px;letter-spacing:.04em;}
  .brand a{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none;}
  .brand .mark{width:38px;height:38px;border:1px solid var(--hai);color:var(--hai);font-family:var(--mono);
    display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.08em;}
  nav ul{display:flex;gap:2px;list-style:none;align-items:center;}
  nav a{display:block;padding:9px 14px;font-size:13px;font-weight:400;text-decoration:none;color:var(--hai);
    border-bottom:1px solid transparent;transition:color .15s;}
  nav a:hover{color:var(--ink);}
  nav a.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500;}
  .menu-btn{display:none;border:1px solid var(--hai);background:transparent;color:var(--ink);padding:8px 12px;font-size:13px;cursor:pointer;}
  main{min-height:60vh;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .wrap{max-width:1040px;margin:0 auto;padding-left:40px;padding-right:40px;}
  section{padding:92px 0;}
  .pagehead{border-bottom:1px solid var(--line);padding:96px 0 72px;}
  .pagehead h2{font-family:var(--mincho);font-size:34px;font-weight:600;letter-spacing:.08em;}
  .pagehead .en{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--hai);font-weight:400;margin-bottom:18px;}
  .label{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.3em;color:var(--hai);margin-bottom:32px;position:relative;padding-bottom:16px;}
  .label::after{content:"";position:absolute;left:0;bottom:0;width:32px;height:1px;background:var(--hai);}
  h3.sub{font-family:var(--mincho);font-size:16.5px;font-weight:600;margin-bottom:18px;letter-spacing:.04em;}
  .theme-title{font-family:var(--mincho);font-size:24px;font-weight:600;line-height:1.7;letter-spacing:.04em;margin-bottom:30px;}
  .theme-title .mada{color:var(--hai);}
  .page section > p{max-width:74ch;}
  .page section > p + p{margin-top:20px;}
  .hero{position:relative;border-bottom:1px solid var(--line);}
  .hero-inner{position:relative;max-width:1040px;margin:0 auto;padding:150px 40px 140px;text-align:left;}
  .hero .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--hai);margin-bottom:44px;}
  .hero h1{font-family:var(--mincho);font-size:clamp(28px,4.6vw,50px);font-weight:600;line-height:1.6;letter-spacing:.06em;}
  .hero h1 .mada{color:var(--hai);}
  .hero .en-line{font-family:var(--mono);font-size:12px;letter-spacing:.34em;color:var(--hai);margin-top:22px;}
  .hero .meta-line{margin-top:56px;font-size:14.5px;font-weight:400;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .hero .meta-line .mono{font-family:var(--mono);letter-spacing:.16em;color:var(--ink);}
  .hero .meta-line .sep{color:var(--hai);}
  .hero .hero-cta{display:flex;gap:16px;flex-wrap:wrap;margin-top:44px;}
  .hero .hero-cta .btn{margin-top:0;}
  .btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:13.5px;
    padding:15px 46px;border:1px solid var(--ink);cursor:pointer;transition:opacity .15s,background .15s,color .15s;letter-spacing:.14em;margin-top:44px;}
  .btn:hover{opacity:.82;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(242,239,233,.5);}
  .btn.ghost:hover{background:var(--ink);color:var(--bg);opacity:1;}
  .news{list-style:none;}
  .news li{display:flex;gap:28px;padding:20px 4px;border-bottom:1px solid var(--line);font-size:14.5px;}
  .news .date{flex:0 0 8em;color:var(--hai);font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;padding-top:3px;}
  .center{text-align:center;}
  table.wf{width:100%;border-collapse:collapse;font-size:14.5px;}
  table.wf th,table.wf td{border-bottom:1px solid var(--line);padding:18px 22px;text-align:left;vertical-align:top;}
  table.wf th{background:transparent;width:230px;font-weight:500;color:var(--hai);}
  table.wf td{line-height:1.9;font-weight:300;}
  .cols{display:flex;gap:28px;flex-wrap:wrap;}
  .cols>*{flex:1;min-width:250px;}
  .fee-card{background:var(--panel);border-radius:8px;padding:30px 32px;}
  .fee-card table.wf th,.fee-card table.wf td{background:transparent;border-bottom:1px solid var(--line);padding:13px 0;}
  .fee-card table.wf th{width:auto;}
  .fee-card table.wf tr:last-child th,.fee-card table.wf tr:last-child td{border-bottom:none;}
  .subtabs{display:flex;border-bottom:1px solid var(--line);margin:48px 0 52px;}
  .subtab{background:none;border:none;color:var(--hai);font-family:var(--sans);font-size:14.5px;font-weight:500;
    letter-spacing:.06em;padding:14px 28px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s;}
  .subtab:hover{color:var(--ink);}
  .subtab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
  .tabpane{display:none;}
  .tabpane.active{display:block;animation:fade .3s ease;}
  .venues{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .venue-card{background:var(--panel);border-radius:8px;padding:30px 32px;}
  .venue-card .v-bldg{font-family:var(--mincho);font-size:20px;font-weight:600;letter-spacing:.05em;}
  .venue-card .v-en{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--hai);margin-left:12px;}
  .venue-card ul{list-style:none;margin-top:16px;}
  .venue-card li{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
    padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .venue-card li:last-child{border-bottom:none;padding-bottom:0;}
  .venue-card .v-where{color:var(--hai);font-size:13px;white-space:nowrap;}
  .route{max-width:640px;}
  .route h4{font-size:14px;font-weight:700;margin:0 0 10px;}
  .route h4:not(:first-child){margin-top:26px;}
  .route ul{list-style:none;font-size:13.5px;margin-bottom:4px;}
  .route li{padding:10px 0;border-bottom:1px solid var(--line);line-height:1.7;}
  iframe.map{width:100%;height:300px;border:1px solid var(--line);border-radius:6px;display:block;
    filter:grayscale(1) brightness(.82) contrast(1.05);}   
  .maplink{font-size:12px;margin-top:8px;}
  .tl{border-left:1px solid var(--line);margin-left:118px;margin-top:16px;}
  .tl .item{position:relative;padding:0 0 52px 36px;}
  .tl .item:last-child{padding-bottom:0;}
  .tl .item::before{content:"";position:absolute;left:-4px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.9;}
  .tl .time{position:absolute;left:-150px;top:3px;width:126px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--hai);letter-spacing:.12em;line-height:1.7;}
  .tl h4{font-family:var(--mincho);font-size:18px;font-weight:600;margin-bottom:10px;line-height:1.6;letter-spacing:.04em;}
  .tl p{font-size:13.5px;color:var(--hai);line-height:1.85;font-weight:300;max-width:64ch;}
  .venue-tag{font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--hai);margin-left:6px;white-space:nowrap;}
  .entry-block{background:var(--panel);border-radius:10px;padding:40px 44px;margin-bottom:32px;}
  .form-row{margin-bottom:22px;}
  .form-row label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;}
  .req{color:var(--hai);background:transparent;border:1px solid var(--hai);font-size:10px;padding:1px 7px;margin-left:8px;vertical-align:middle;letter-spacing:.1em;}
  .form-row .field{border:1px solid var(--line);background:var(--bg);height:44px;border-radius:4px;}
  .form-row .field.area{height:130px;}
  .tbd{color:var(--hai);border-bottom:1px dotted #5b554b;}
  .note{font-size:12px;color:var(--hai);margin-top:36px;padding:4px 0 4px 16px;border-left:1px solid var(--line);line-height:1.9;font-weight:300;}
  footer{border-top:1px solid var(--line);padding:64px 32px 56px;text-align:center;font-size:12.5px;color:var(--hai);font-weight:300;}
  footer .fmono{font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;color:var(--hai);margin-bottom:20px;}
  footer .fbrand{font-family:var(--mincho);font-weight:600;color:var(--ink);font-size:15px;margin-bottom:12px;letter-spacing:.06em;}
  @media (max-width:900px){
    header{padding:12px 18px;}
    .brand span:last-child{font-size:12.5px;line-height:1.4;}
    .menu-btn{display:block;}
    nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(0,0,0,.5);}
    nav.open{display:block;}
    nav ul{flex-direction:column;gap:0;align-items:stretch;}
    nav a{padding:15px 20px;border-bottom:1px solid var(--line);border-left:2px solid transparent;}
    nav a.active{border-bottom:1px solid var(--line);border-left-color:var(--ink);}
    .wrap{padding-left:22px;padding-right:22px;}
    section{padding:60px 0;}
    .hero-inner{padding:96px 22px 104px;}
    .hero .meta-line{margin-top:40px;}
    .pagehead{padding:60px 0 48px;}
    .pagehead h2{font-size:26px;}
    .cols{gap:22px;}
    table.wf th,table.wf td{display:block;width:100%;}
    table.wf th{width:100%;padding:16px 18px 3px;border-bottom:none;font-size:12px;letter-spacing:.06em;}
    table.wf td{padding:3px 18px 18px;}
    .subtab{flex:1 1 0;padding:14px 8px;text-align:center;}
    .venues{grid-template-columns:1fr;gap:18px;}
    .venue-card{padding:24px 22px;}
    .venue-card li{flex-direction:column;align-items:flex-start;gap:3px;}
    .entry-block{padding:28px 24px;}
    .tl{margin-left:4px;}
    .tl .item{padding-left:26px;padding-bottom:44px;}
    .tl .time{position:static;display:block;width:auto;text-align:left;margin-bottom:7px;}
    .tl .time br{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="index.html"><span class="mark">JSSD</span><span><span class="nw">2026年度</span> <span class="nw">日本デザイン学会</span> <span class="nw">秋季企画大会</span></span></a></div>
  <button class="menu-btn" aria-label="メニュー">☰</button>
  <nav><ul>
    <li><a href="index.html">Top</a></li>
    <li><a href="summary.html">大会概要</a></li>
    <li><a href="schedule.html">スケジュール</a></li>
    <li><a href="registration.html">申込み</a></li>
    <li><a href="access.html">アクセス</a></li>
    <li><a href="contact.html" class="active">お問合せ</a></li>
  </ul></nav>
</header>

<main>
<div class="page">
  <div class="pagehead"><div class="wrap"><span class="en">CONTACT</span><h2>お問合せ</h2></div></div>
  <section class="wrap" style="max-width:680px;">
    <p>大会に関するお問い合わせは、下記のメールアドレスまでご連絡ください。</p>
    <p style="margin-top:34px;font-family:var(--mono);font-size:17px;letter-spacing:.08em;">jssd2026fall@gmail.com</p>
  </section>
</div>
</main>

<footer>
  <p class="fmono">WILL DESIGN STILL MATTER?</p>
  <p class="fbrand"><span class="nw">2026年度</span> <span class="nw">日本デザイン学会</span> <span class="nw">秋季企画大会</span> <span class="nw">in Kyoto</span></p>
  <p><span class="nw">主催：一般社団法人 日本デザイン学会</span> ／ <span class="nw">共催：立命館大学 デザイン・アート学部</span></p>
  <p style="margin-top:10px;"><span class="nw">お問合せ：jssd2026fall@gmail.com</span></p>
</footer>

<script>
const navEl=document.querySelector("header nav");
document.querySelector(".menu-btn").addEventListener("click",()=>navEl.classList.toggle("open"));
</script>
</body>
</html>
