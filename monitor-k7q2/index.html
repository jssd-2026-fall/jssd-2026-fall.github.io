<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Monitor</title>
<style>
  html,body{margin:0;height:100%;background:#12110f;overflow:hidden;cursor:none}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}
  #app.pick{pointer-events:auto}
  #fs{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:600 28px sans-serif;color:#efeeec;background:rgba(0,0,0,.7);border:1px solid #464441;padding:18px 32px;white-space:nowrap;opacity:0;transition:opacity .6s;z-index:10;pointer-events:none}
  #fs.on{opacity:1}
  #keep{position:fixed;width:16px;height:16px;opacity:0.02;left:0;bottom:0}
</style>
</head>
<body>
<iframe id="app" title="monitor" allow="autoplay; fullscreen; screen-wake-lock"></iframe>
<div id="fs">クリック（リモコンは決定ボタン）で全画面</div>
<video id="keep" src="keep.mp4" muted loop playsinline autoplay></video>
<script>
// 会場モニターの外枠（2026-11-15）。スライド本体は app.html を iframe で中に読む。
// ・全画面はこの外枠でかける。新しい版が出て中身（app.html）が読み直しても、外枠はそのままなので全画面が解けない
// ・ブラウザは操作なしの全画面を許さないので、外枠そのものを読み直したとき（電源を入れ直した・手でリロードした）は、
//   最初の1回だけリモコンの決定ボタンを押す
// ・この外枠はなるべく直さない（直して上げ直すと、モニター側で手で読み直すまで古いまま）
var app = document.getElementById('app'), fs = document.getElementById('fs');
var SCREEN = new URLSearchParams(location.search).get('screen');
app.src = 'app.html' + location.search;
if (!SCREEN) app.classList.add('pick');   // 画面を選ぶときは、中身を押せるようにする
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function goFull() {
  var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
  if (f && !isFull()) { try { var p = f.call(d); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
}
var hideT = null;
function hint() {
  if (!SCREEN || isFull()) { fs.classList.remove('on'); return; }
  fs.classList.add('on'); clearTimeout(hideT); hideT = setTimeout(function () { fs.classList.remove('on'); }, 6000);
}
if (SCREEN) {
  document.addEventListener('click', goFull);
  document.addEventListener('keydown', goFull);
  document.addEventListener('fullscreenchange', hint);
  document.addEventListener('webkitfullscreenchange', hint);
  hint();
  window.focus();
}
// スリープ対策：画面を点けたままにするようブラウザに頼む。見えない小さな動画も流し続ける
var lock = null;
function wake() {
  if (!navigator.wakeLock || (lock && !lock.released)) return;
  navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {});
}
wake();
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wake(); });
document.addEventListener('click', wake);
document.addEventListener('keydown', wake);
setInterval(function () { wake(); var k = document.getElementById('keep'); if (k.paused && k.play) k.play().catch(function () {}); }, 60000);
var v = document.getElementById('keep'); if (v.play) v.play().catch(function () {});
</script>
</body>
</html>
